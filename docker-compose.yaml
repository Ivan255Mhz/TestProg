services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms_password
    ports:
      - "5433:5432"
    volumes:
      - sms_pgdata:/var/lib/postgresql/data

volumes:
  sms_pgdata:
